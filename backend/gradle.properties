# ---------------------------------------------------------------------------
# Gradle self-healing & performance settings
# ---------------------------------------------------------------------------

# Auto-download the correct JDK if not present on this machine.
org.gradle.java.installations.auto-provision=true
org.gradle.java.installations.auto-detect=true

# Daemon settings – restart after 3 builds to recover from memory/classloader issues.
org.gradle.daemon=true
org.gradle.daemon.idletimeout=3600000

# Parallel & caching – speeds up repeated builds and recovers from partial state.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# Increase heap – prevents OOM mid-build on large dependency graphs.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Print full stack traces on failure so root cause is always visible.
org.gradle.logging.stacktrace=all
