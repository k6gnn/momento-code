spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:8081}
    proximity-radius-meters: ${PROXIMITY_RADIUS_METERS:50}
    drop-points: ${DROP_POINTS:10}
    discovery-points: ${DISCOVERY_POINTS:15}
  aws:
    region: ${AWS_REGION}
    bucket: ${AWS_BUCKET}
    access-key-id: ${AWS_ACCESS_KEY_ID}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY}
    presigned-url-minutes: ${AWS_PRESIGNED_URL_MINUTES:15}
  firebase:
    project-id: ${FIREBASE_PROJECT_ID}
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH}
  notifications:
    enabled: ${NOTIFICATIONS_ENABLED:false}