spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/momento
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: 8080

app:
  security:
    allowed-origins: http://localhost:8081
    proximity-radius-meters: 50
    drop-points: 10
    discovery-points: 15
  aws:
    region: eu-central-1
    bucket: your-private-bucket
    access-key-id: REPLACE_ME
    secret-access-key: REPLACE_ME
    presigned-url-minutes: 15
  firebase:
    project-id: your-firebase-project-id
    service-account-path: /absolute/path/firebase-service-account.json
  notifications:
    enabled: false
